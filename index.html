<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>سَيْر للأنظمة الذكية | نُسيّر عملك بذكاء</title>
  <meta name="description" content="أنظمة إدارة داخلية، ولوحات متابعة لحظية، ووكلاء ذكاء اصطناعي للمهام المتكررة، مبنية على طريقة عمل شركتك. الرياض.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="سَيْر للأنظمة الذكية | نُسيّر عملك بذكاء">
  <meta property="og:description" content="ندرس طريقة عملكم، ثم نبني النظام الذي يختصرها.">
  <meta property="og:image" content="assets/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0F5C50">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var d = document.documentElement, p = new URLSearchParams(location.search), t = null;
      if (p.get("lang") === "en") { d.lang = "en"; d.dir = "ltr"; }
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t === "dark" || t === "light") d.setAttribute("data-theme", t);
      d.className += " js";
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">انتقل إلى المحتوى</a>

  <header class="top" id="top">
    <div class="wrap top-inner">
      <a class="brand" href="#top" aria-label="">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 8c6 0 8 8 13 8M6 24c6 0 8-8 13-8h7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="6" cy="8" r="3" fill="currentColor"/><circle cx="6" cy="24" r="3" fill="currentColor"/><circle cx="26" cy="16" r="3.4" class="mark-end"/></svg>
        <span class="brand-name js-brand-short"></span>
      </a>
      <nav class="nav" aria-label="">
        <a href="#services" data-i18n="nav_services"></a>
        <a href="#work" data-i18n="nav_work"></a>
        <a href="#process" data-i18n="nav_process"></a>
        <a href="#faq" data-i18n="nav_faq"></a>
      </nav>
      <div class="tools">
        <a class="tool lang" id="lang-btn" href="?lang=en" data-i18n="lang_switch">English</a>
        <button class="tool" id="theme-btn" type="button" data-i18n-aria="theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/><g class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
        </button>
        <a class="btn btn-primary btn-sm top-cta" href="#book" data-i18n="cta_book"></a>
        <button class="tool burger" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu" data-i18n-aria="menu"><span></span><span></span></button>
      </div>
    </div>
    <div class="menu" id="menu" hidden>
      <div class="wrap menu-inner">
        <a href="#services" data-i18n="nav_services"></a>
        <a href="#work" data-i18n="nav_work"></a>
        <a href="#process" data-i18n="nav_process"></a>
        <a href="#faq" data-i18n="nav_faq"></a>
        <a class="btn btn-primary" href="#book" data-i18n="cta_book"></a>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- Hero -->
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <p class="hero-brand"><span class="js-brand"></span><span class="js-tagline"></span></p>
          <h1 data-i18n="hero_title"></h1>
          <p class="lead" data-i18n="hero_lead"></p>
          <div class="actions">
            <a class="btn btn-primary" href="#book" data-i18n="hero_book"></a>
            <a class="btn btn-line js-wa" href="#" target="_blank" rel="noopener" data-wa="wa_hello">
              <svg class="wa-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z"/><path d="M8.8 8.4c.2-.5.5-.5.8-.5h.5c.2 0 .4 0 .5.4l.7 1.7c.1.2 0 .4-.1.6l-.5.6c-.1.2-.1.3 0 .5.5.9 1.3 1.7 2.3 2.2.2.1.4.1.5-.1l.6-.7c.2-.2.4-.2.6-.1l1.6.8c.2.1.3.2.3.4 0 .5-.2 1.2-.7 1.5-.6.4-1.5.6-2.6.2a8.7 8.7 0 0 1-4.6-4.2c-.6-1.2-.4-2.4.1-3.3Z" class="wa-fill"/></svg>
              <span data-i18n="hero_wa"></span>
            </a>
          </div>
          <p class="note" data-i18n="hero_note"></p>
        </div>
        <figure class="map" id="map" role="img" data-i18n-aria="map_label">
          <svg id="map-svg" aria-hidden="true"></svg>
        </figure>
      </div>
      <div class="wrap">
        <dl class="proof" id="proof" data-i18n-aria="proof_label"></dl>
      </div>
    </section>

    <!-- Situations -->
    <section class="sec" id="situations" aria-labelledby="sit-title">
      <div class="wrap">
        <header class="sec-head">
          <h2 id="sit-title" data-i18n="sit_title"></h2>
          <p data-i18n="sit_lead"></p>
        </header>
        <div class="sit" role="table" id="sit"></div>
      </div>
    </section>

    <!-- Services -->
    <section class="sec sec-alt" id="services" aria-labelledby="svc-title">
      <div class="wrap">
        <header class="sec-head">
          <h2 id="svc-title" data-i18n="svc_title"></h2>
          <p data-i18n="svc_lead"></p>
        </header>
        <div class="svc-list" id="svc"></div>
      </div>
    </section>

    <!-- Work -->
    <section class="sec" id="work" aria-labelledby="work-title">
      <div class="wrap">
        <header class="sec-head">
          <h2 id="work-title" data-i18n="work_title"></h2>
          <p data-i18n="work_lead"></p>
        </header>
        <div class="work" id="work-list"></div>
      </div>
    </section>

    <!-- Process -->
    <section class="sec sec-alt" id="process" aria-labelledby="proc-title">
      <div class="wrap">
        <header class="sec-head">
          <h2 id="proc-title" data-i18n="proc_title"></h2>
          <p data-i18n="proc_lead"></p>
        </header>
        <div class="journey" id="journey"></div>
        <div class="eng">
          <h3 data-i18n="eng_title"></h3>
          <p class="eng-lead" data-i18n="eng_lead"></p>
          <div class="eng-list" id="eng"></div>
        </div>
      </div>
    </section>

    <!-- Product -->
    <section class="sec" id="product" aria-labelledby="prod-title">
      <div class="wrap prod">
        <div class="prod-copy">
          <p class="prod-tags"><span data-i18n="prod_tag"></span><span class="pill" data-i18n="prod_status"></span></p>
          <h2 id="prod-title" data-i18n="prod_title"></h2>
          <p data-i18n="prod_text"></p>
          <a class="btn btn-line js-wa" href="#" target="_blank" rel="noopener" data-wa="wa_dhimma"><span data-i18n="prod_cta"></span></a>
        </div>
        <figure class="prod-shot"><img src="assets/work/dhimma.webp" alt="" width="1234" height="690" loading="lazy" decoding="async"></figure>
      </div>
    </section>

    <!-- Founder -->
    <section class="sec sec-tight sec-alt" id="founder" aria-labelledby="founder-title">
      <div class="wrap">
        <header class="sec-head">
          <h2 id="founder-title" data-i18n="founder_title"></h2>
          <p data-i18n="team_lead"></p>
        </header>
        <div class="team">
          <article class="founder">
            <img class="founder-photo" src="assets/founder.webp" alt="" width="760" height="1147" loading="lazy" decoding="async">
            <div class="founder-copy">
              <p class="founder-name"><strong data-i18n="founder_name"></strong><span data-i18n="founder_role"></span></p>
              <p data-i18n="founder_text"></p>
              <p class="founder-links">
                <a class="js-founder-site" href="#" target="_blank" rel="noopener" data-i18n="founder_site"></a>
                <a class="js-linkedin" href="#" target="_blank" rel="noopener" data-i18n="founder_li"></a>
              </p>
            </div>
          </article>
          <article class="network" aria-labelledby="net-title">
            <span class="net-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="4.2"/><circle cx="6" cy="8" r="2.6"/><circle cx="26" cy="8" r="2.6"/><circle cx="6" cy="24" r="2.6"/><circle cx="26" cy="24" r="2.6"/><path d="M8.2 9.4 12.6 13.6M23.8 9.4 19.4 13.6M8.2 22.6 12.6 18.4M23.8 22.6 19.4 18.4"/></svg></span>
            <h3 id="net-title" data-i18n="net_title"></h3>
            <p data-i18n="net_text"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- FAQ -->
    <section class="sec" id="faq" aria-labelledby="faq-title">
      <div class="wrap faq-wrap">
        <header class="sec-head">
          <h2 id="faq-title" data-i18n="faq_title"></h2>
        </header>
        <div class="faq" id="faq-list"></div>
      </div>
    </section>

    <!-- Booking -->
    <section class="sec book-sec" id="book" aria-labelledby="book-title">
      <div class="wrap">
        <div class="book">
          <div class="book-main">
            <h2 id="book-title" data-i18n="book_title"></h2>
            <p class="book-lead" data-i18n="book_lead"></p>
            <p class="book-direct" id="book-direct" hidden><a class="btn btn-line" id="booking-url" href="#" target="_blank" rel="noopener" data-i18n="book_direct"></a></p>

            <form class="form" id="book-form" novalidate>
              <fieldset class="field">
                <legend data-i18n="f_type"></legend>
                <div class="choices choices-2">
                  <label class="choice"><input type="radio" name="type" id="type-remote" value="remote" checked><span><b data-i18n="f_type_remote"></b><small data-i18n="f_type_remote_sub"></small></span></label>
                  <label class="choice"><input type="radio" name="type" id="type-visit" value="visit"><span><b data-i18n="f_type_visit"></b><small data-i18n="f_type_visit_sub"></small></span></label>
                </div>
              </fieldset>

              <fieldset class="field">
                <legend><span data-i18n="f_service"></span> <small class="opt" data-i18n="f_optional"></small></legend>
                <div class="choices choices-svc" id="services-pick"></div>
              </fieldset>

              <fieldset class="field">
                <legend data-i18n="f_day"></legend>
                <div class="choices choices-days" id="days"></div>
                <small class="err" id="err-day" hidden data-i18n="err_day"></small>
              </fieldset>

              <fieldset class="field">
                <legend><span data-i18n="f_time"></span> <small class="legend-note" data-i18n="f_time_note"></small></legend>
                <div class="choices choices-times" id="times"></div>
                <small class="err" id="err-time" hidden data-i18n="err_time"></small>
              </fieldset>

              <div class="row-2">
                <div class="field">
                  <label for="f-name" data-i18n="f_name"></label>
                  <input id="f-name" name="name" autocomplete="name" required aria-describedby="err-name">
                  <small class="err" id="err-name" hidden data-i18n="err_name"></small>
                </div>
                <div class="field">
                  <label for="f-email" data-i18n="f_email"></label>
                  <input id="f-email" name="email" type="email" inputmode="email" autocomplete="email" dir="ltr" required aria-describedby="err-email" data-i18n-ph="f_email_ph">
                  <small class="err" id="err-email" hidden data-i18n="err_email"></small>
                </div>
              </div>
              <div class="row-2">
                <div class="field">
                  <label for="f-company"><span data-i18n="f_company"></span> <small class="opt" data-i18n="f_optional"></small></label>
                  <input id="f-company" name="company" autocomplete="organization" data-i18n-ph="f_company_ph">
                </div>
                <div class="field">
                  <label for="f-phone"><span data-i18n="f_phone"></span> <small class="opt" data-i18n="f_optional"></small></label>
                  <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr">
                </div>
              </div>
              <div class="field">
                <label for="f-topic"><span data-i18n="f_topic"></span> <small class="opt" data-i18n="f_optional"></small></label>
                <textarea id="f-topic" name="topic" rows="3" data-i18n-ph="f_topic_ph"></textarea>
              </div>
              <!-- Spam trap: people never see or fill this -->
              <input class="hp" type="checkbox" name="botcheck" id="f-botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">

              <div class="send">
                <button class="btn btn-primary" type="submit" id="send-main">
                  <svg class="mail-i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.8 6.5 8.2 6 8.2-6"/></svg>
                  <span id="send-main-label" data-i18n="send_main"></span>
                </button>
                <button class="send-alt" type="button" id="send-wa">
                  <svg class="wa-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z"/><path d="M8.8 8.4c.2-.5.5-.5.8-.5h.5c.2 0 .4 0 .5.4l.7 1.7c.1.2 0 .4-.1.6l-.5.6c-.1.2-.1.3 0 .5.5.9 1.3 1.7 2.3 2.2.2.1.4.1.5-.1l.6-.7c.2-.2.4-.2.6-.1l1.6.8c.2.1.3.2.3.4 0 .5-.2 1.2-.7 1.5-.6.4-1.5.6-2.6.2a8.7 8.7 0 0 1-4.6-4.2c-.6-1.2-.4-2.4.1-3.3Z" class="wa-fill"/></svg>
                  <span data-i18n="send_wa_alt"></span>
                </button>
              </div>
              <p class="form-status err" id="form-status" role="alert" hidden></p>
              <p class="note" id="send-note"></p>
            </form>

            <div class="sent" id="sent" hidden tabindex="-1">
              <span class="sent-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
              <h3 data-i18n="sent_title"></h3>
              <p data-i18n="sent_text"></p>
              <pre class="sent-summary" id="sent-summary"></pre>
              <button class="btn btn-line" type="button" id="sent-again" data-i18n="sent_again"></button>
            </div>
          </div>

          <aside class="book-side" aria-labelledby="direct-title">
            <h3 id="direct-title" data-i18n="direct_title"></h3>
            <dl class="direct">
              <div><dt data-i18n="direct_email"></dt><dd class="copy-row"><a class="js-email" href="#" dir="ltr"></a><button class="copy" type="button" id="copy-email" data-i18n="copy"></button></dd></div>
              <div><dt data-i18n="direct_wa"></dt><dd><a class="js-wa js-phone" href="#" target="_blank" rel="noopener" dir="ltr"></a></dd></div>
              <div><dt data-i18n="direct_li"></dt><dd><a class="js-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a></dd></div>
              <div><dt data-i18n="direct_city"></dt><dd class="js-city"></dd></div>
            </dl>
            <p class="note" data-i18n="direct_reply"></p>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <p class="foot-brand"><span class="js-brand"></span><span class="js-tagline"></span></p>
      <p class="foot-copy">© <span id="year"></span> <span class="js-brand"></span>. <span data-i18n="foot_rights"></span></p>
    </div>
  </footer>

  <a class="wa-float js-wa" id="wa-float" href="#" target="_blank" rel="noopener" data-wa="wa_hello" data-i18n-aria="wa_float" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z"/><path d="M8.8 8.4c.2-.5.5-.5.8-.5h.5c.2 0 .4 0 .5.4l.7 1.7c.1.2 0 .4-.1.6l-.5.6c-.1.2-.1.3 0 .5.5.9 1.3 1.7 2.3 2.2.2.1.4.1.5-.1l.6-.7c.2-.2.4-.2.6-.1l1.6.8c.2.1.3.2.3.4 0 .5-.2 1.2-.7 1.5-.6.4-1.5.6-2.6.2a8.7 8.7 0 0 1-4.6-4.2c-.6-1.2-.4-2.4.1-3.3Z" class="wa-fill"/></svg>
  </a>

  <script src="data/content.js"></script>
  <script src="app.js"></script>
</body>
</html>
